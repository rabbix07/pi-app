# Release: build installers on CI and publish them, so the app updates itself
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and publish, e.g. 0.8.1 (must match the tag it should create)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # electron-builder reads the release target from here; matches the `publish` block in electron-builder.yml
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Electron and builder tooling
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}

      - name: Align package version with the tag
        shell: bash
        run: |
          ver="${{ github.event.inputs.version }}"
          [ -n "$ver" ] || ver="${GITHUB_REF_NAME#v}"
          npm version "$ver" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do npm ci && exit 0; echo "npm ci failed (attempt $i)"; sleep 20; done; exit 1

      - run: npm run icon:export
      - run: npm run build

      # NSIS installer + latest.yml; publishing from here is what makes installed apps update
      - name: Package and publish
        run: npx electron-builder --win --publish always

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Electron and builder tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-mac-${{ hashFiles('package-lock.json') }}

      - name: Align package version with the tag
        run: |
          ver="${{ github.event.inputs.version }}"
          [ -n "$ver" ] || ver="${GITHUB_REF_NAME#v}"
          npm version "$ver" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: |
          for i in 1 2 3; do npm ci && exit 0; echo "npm ci failed (attempt $i)"; sleep 20; done; exit 1

      # One runner packages both arches; npm only installs this machine's pty binary.
      - name: Add the other macOS pty binary
        run: |
          set -euo pipefail
          ver="$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@lydell/node-pty/package.json','utf8')).version")"
          npm install --no-save --force "@lydell/node-pty-darwin-x64@$ver" "@lydell/node-pty-darwin-arm64@$ver"

      - run: npm run icon:export
      - run: npm run build

      - name: Detect signing credentials
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -n "$MACOS_CERTIFICATE" && -n "$MACOS_CERTIFICATE_PASSWORD" && -n "$APPLE_API_KEY_CONTENT" ]]; then
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key"
            chmod 600 "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Apple signing secrets: building unsigned. The DMG works, but in-app updates are disabled on macOS (Squirrel.Mac requires a signature)."
          fi

      # dmg + zip for both arches, latest-mac.yml included: the zip is what Squirrel.Mac diffs against
      - name: Package and publish (signed)
        if: steps.signing.outputs.enabled == 'true'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-builder --mac --publish always

      - name: Package and publish (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish always

      - name: Remove App Store Connect key
        if: always() && steps.signing.outputs.enabled == 'true'
        run: rm -f "$APPLE_API_KEY"

  release-notes:
    needs: [build-win, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          ver="${{ github.event.inputs.version }}"
          [ -n "$ver" ] || ver="${GITHUB_REF_NAME#v}"
          if node scripts/generate-release-notes.mjs "$ver" > body.md; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CHANGELOG section for $ver; leaving the release body as electron-builder wrote it"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply notes to the release
        if: steps.notes.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ github.event.inputs.version }}"
          [ "$tag" = "v" ] && tag="$GITHUB_REF_NAME"
          gh release edit "$tag" --notes-file body.md
