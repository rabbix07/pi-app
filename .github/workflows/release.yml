# Release: build the Windows installer on CI and publish it, so the app updates itself
# A macOS job lived here until v0.8.0; without an Apple certificate the build cannot self-update,
# and this app is Windows-only in daily use, so it was removed rather than shipped broken.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish, e.g. 0.8.1 (must match the tag it should create)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # electron-builder reads the release target from here; matches the `publish` block in electron-builder.yml
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Both platform jobs upload into one draft release. Letting electron-builder create it on both
  # sides races: each job can create its own release for the same tag and split the assets.
  create-release:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Ensure a draft release exists
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="${{ github.event.inputs.version }}"
          [ -n "$ver" ] || ver="${GITHUB_REF_NAME#v}"
          tag="v$ver"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
          else
            gh release create "$tag" --draft --title "Pi Studio $tag" --notes "Release notes land here when the builds finish."
          fi

  build-win:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache Electron and builder tooling
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}

      - name: Align package version with the tag
        shell: bash
        run: |
          ver="${{ github.event.inputs.version }}"
          [ -n "$ver" ] || ver="${GITHUB_REF_NAME#v}"
          npm version "$ver" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do npm ci && exit 0; echo "npm ci failed (attempt $i)"; sleep 20; done; exit 1

      - run: npm run icon:export
      - run: npm run build

      # NSIS installer + latest.yml; publishing from here is what makes installed apps update
      - name: Package and publish
        run: npx electron-builder --win --publish always

  publish:
    needs: [create-release, build-win]
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # Full history so the previous release tag can be found for the compare link.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build notes from CHANGELOG
        id: notes
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          if ! node scripts/generate-release-notes.mjs "$ver" > body.md; then
            echo "::warning::No CHANGELOG section for $ver; writing a bare title"
            printf '## Pi Studio v%s\n' "$ver" > body.md
          fi
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            {
              echo
              echo "**Full Changelog**: [$prev...$TAG](https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG)"
            } >> body.md
          fi

      # Every asset must be there before the release goes public, otherwise an installed app sees an
      # update whose installer is missing and gives up until the next 4 h check.
      - name: Verify the feed and the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$names"
          for required in latest.yml; do
            grep -qx "$required" <<<"$names" || { echo "::error::release is missing $required"; exit 1; }
          done
          grep -q '\.exe$' <<<"$names" || { echo "::error::release has no Windows installer"; exit 1; }

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --notes-file body.md --draft=false
          gh release view "$TAG" --json tagName,isDraft,assets --jq '{tag:.tagName,draft:.isDraft,assets:(.assets|length)}'
